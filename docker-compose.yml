services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safety
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d safety"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}@db:5432/safety
      YOLO_WEIGHTS: /models/yolo11n.pt
      ZONES_FILE: ${ZONES_FILE:-/app/config/zones.example.json}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./config:/app/config:ro", "model_data:/models"]
volumes:
  postgres_data: {}
  model_data: {}
