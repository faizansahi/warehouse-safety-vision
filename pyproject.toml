[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="warehouse-safety-vision"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","sqlalchemy>=2,<3","psycopg[binary]>=3.2,<4","alembic>=1.13,<2","pydantic-settings>=2.5,<3","python-multipart>=0.0.12,<1","opencv-python-headless>=4.10,<5","numpy>=2,<3","ultralytics>=8.3,<9"]
[project.optional-dependencies]
dev=["httpx>=0.27,<1","pytest>=8,<9","pytest-cov>=5,<7","ruff>=0.8,<1"]
[tool.hatch.build.targets.wheel]
packages=["src/warehouse_vision"]
[tool.pytest.ini_options]
pythonpath=["src"]
[tool.ruff]
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP"]
ignore=["B008"]
